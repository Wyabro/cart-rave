# Cart Clash — PR / push gate (typecheck + tests + knip + health + production build).
# Visual QA (shoot / blackframes) and full battery stay manual — not ordinary PR CI.
# Exact-HEAD release gate: npm run release:check (includes complete battery evidence).

name: check

on:
  push:
    branches:
      - cart-clash
      - main
  pull_request:
    branches:
      - cart-clash
      - main

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · knip · health · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        # * .npmrc sets legacy-peer-deps=true (partyserver / workers-types peer skew).
        run: npm ci

      - name: QA gate
        run: npm run qa

      - name: Production build
        run: npm run build
